[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RazTan1234/quicdrop"
authors = ["Răzvan-Mihail Tănăsescu"]

[workspace.dependencies]
quicdrop-core = { path = "crates/quicdrop-core", version = "0.0.1" }
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
